rules:
  - id: cyberlens.hardcoded-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A secret (password, JWT secret or similar) is written into the code. Anyone who can read the repo can
      use it. Load it from an environment variable and rotate the one that is committed.
    patterns:
      - pattern-either:
          - pattern: $K = $VAL
          - pattern: "{..., $K: $VAL, ...}"
          - pattern: jwt.sign($P, $VAL, ...)
          - pattern: jwt.verify($P, $VAL, ...)
      - metavariable-regex:
          metavariable: $VAL
          # values with spaces are skipped (error messages looked like secrets), so passphrases with spaces are missed
          regex: ^["'`][^"'`$\s]{8,}["'`]$
      - metavariable-regex:
          metavariable: $K
          regex: (?i).*(jwt|session|cookie|signing)?_?(secret|passwd|password|privatekey).*
      - focus-metavariable: $VAL
    metadata:
      category: security
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2025 - Authentication Failures"]
      confidence: MEDIUM
