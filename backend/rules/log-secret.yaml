rules:
  - id: cyberlens.log-secret
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A password, token or secret is written to the logs. Logs are copied, searched and kept for a long
      time, so anyone with log access gets the credential. Log who did what, never the secret itself.
    patterns:
      - pattern-either:
          - pattern: console.$M(..., <... $X.password ...>, ...)
          - pattern: console.$M(..., <... $X.token ...>, ...)
          - pattern: console.$M(..., <... $X.secret ...>, ...)
          - pattern: console.$M(..., <... password ...>, ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(log|info|warn|error|debug)$
    metadata:
      category: security
      cwe: ["CWE-532: Insertion of Sensitive Information into Log File"]
      owasp: ["A09:2025 - Security Logging and Alerting Failures"]
      confidence: MEDIUM
